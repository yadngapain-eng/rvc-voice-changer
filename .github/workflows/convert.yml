
name: RVC Voice Changer

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true
      model_url:
        description: 'Link Google Drive Model (.pth) [Opsional]'
        required: false
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc
          restore-keys: |
            ${{ runner.os }}-pip-rvc

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}" "${{ github.event.inputs.model_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
