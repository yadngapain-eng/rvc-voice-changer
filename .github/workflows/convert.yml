name: RVC Voice Changer (Auto Model)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Bebaskan disk space (fix "No space left on device")
      # ---------------------------------------------------------------
      - name: Free Disk Space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "After:"
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v14
          restore-keys: |
            ${{ runner.os }}-pip-rvc-v14

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v14

      # ---------------------------------------------------------------
      # 2. Clone repo RVC (sebelumnya TIDAK ADA -> "No such file or directory")
      # ---------------------------------------------------------------
      - name: Clone RVC Repo
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git \
            Retrieval-based-Voice-Conversion-WebUI

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      # ---------------------------------------------------------------
      # 3. Torch CPU — pakai pasangan versi yang valid
      # ---------------------------------------------------------------
      - name: Install Torch CPU Only
        run: |
          pip install torch==2.4.1+cpu torchaudio==2.4.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
      # ---------------------------------------------------------------
      # 4. Build tools untuk --no-build-isolation
      # ---------------------------------------------------------------
      - name: Install Build Tools
        run: |
          pip install setuptools wheel cython

      # ---------------------------------------------------------------
      # 5. Install requirements (TANPA kondisi if: -> cache pip tidak
      #    menyimpan paket terinstal, hanya wheel)
      # ---------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt

      # ---------------------------------------------------------------
      # 6. fairseq: --no-build-isolation supaya pakai torch CPU yang
      #    sudah ada, bukan download ulang torch+CUDA (~3 GB)
      # ---------------------------------------------------------------
      - name: Install Fairseq
        run: |
          pip install git+https://github.com/facebookresearch/fairseq.git \
            --no-deps --no-build-isolation -c constraints.txt

      # ---------------------------------------------------------------
      # 7. Deps runtime fairseq — versi yang SESUAI dengan fairseq 0.12.2
      #    (fairseq butuh hydra-core<1.1, omegaconf<2.1, sacrebleu)
      # ---------------------------------------------------------------
      - name: Install Fairseq Runtime Deps
        run: |
          pip install \
            "hydra-core>=1.0.7,<1.1" \
            "omegaconf>=2.0,<2.1" \
            "sacrebleu>=1.4.12" \
            sacremoses \
            bitarray

      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          REQ=$(find . -maxdepth 2 -name "requirements*.txt" | head -1)
          if [ -z "$REQ" ]; then
            echo "::warning::requirements.txt tidak ditemukan di repo RVC, skip"
          else
            echo "Memakai: $REQ"
            grep -v -E "torch|fairseq" "$REQ" > requirements_fixed.txt
            pip install -r requirements_fixed.txt
          fi
          cd ..

      - name: Download Model from Release
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          curl -L -o Retrieval-based-Voice-Conversion-WebUI/assets/weights/female_model.pth \
          https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0/female_model.pth

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
