
name: RVC Voice Changer (Auto Model)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v4
          restore-keys: |
            ${{ runner.os }}-pip-rvc-v4

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      # TRIK: Downgrade pip agar fairseq bisa di-build
      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      - name: Install Python Dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          # Install fairseq versi fork yang sudah diperbaiki (kompatibel dengan pip baru)
          pip install git+https://github.com/One-sixth/fairseq.git

      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          # Hapus baris fairseq dari requirements RVC asli agar tidak error
          grep -v "fairseq" requirements.txt > requirements_fixed.txt
          pip install -r requirements_fixed.txt
          cd ..

      # UNDUH MODEL DARI RELEASE GITHUB
      - name: Download Model from Release
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          curl -L -o Retrieval-based-Voice-Conversion-WebUI/assets/weights/female_model.pth \
          https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0/female_model.pth

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
