
name: RVC Voice Changer (Auto Model)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v7
          restore-keys: |
            ${{ runner.os }}-pip-rvc-v7

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      - name: Install Torch CPU Only
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python Dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt

      # TRIK STUB: Palsukan torch agar fairseq tidak mengunduh versi CUDA
      - name: Install Fairseq with Torch Stub
        run: |
          # Buat file torch.py palsu di direktori kerja
          echo "raise ImportError('Stub torch, jangan diimport')" > torch.py
          # Install fairseq, pip akan melihat 'torch.py' dan menganggap torch sudah terpasang
          pip install git+https://github.com/One-sixth/fairseq.git
          # Hapus file palsu setelah selesai
          rm torch.py

      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          grep -v -E "torch|fairseq" requirements.txt > requirements_fixed.txt
          pip install -r requirements_fixed.txt
          cd ..

      - name: Download Model from Release
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          curl -L -o Retrieval-based-Voice-Conversion-WebUI/assets/weights/female_model.pth \
          https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0/female_model.pth

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
