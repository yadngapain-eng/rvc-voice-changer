name: RVC Voice Changer (Multi Model)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true
      model_choice:
        description: 'Pilih model'
        type: choice
        required: true
        default: 'f0G40k'
        options:
          - f0G40k
          - pretrained_female
          - pretrained_male
          - custom_female

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v15

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v15

      - name: Clone RVC Repo
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git \
            Retrieval-based-Voice-Conversion-WebUI

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      - name: Install Torch CPU Only
        run: |
          pip install torch==2.4.1+cpu torchaudio==2.4.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Build Tools
        run: |
          pip install setuptools wheel cython

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt

      - name: Install Fairseq
        run: |
          pip install git+https://github.com/facebookresearch/fairseq.git \
            --no-deps --no-build-isolation -c constraints.txt

      - name: Install Fairseq Runtime Deps
        run: |
          pip install \
            "hydra-core>=1.0.7,<1.1" \
            "omegaconf>=2.0,<2.1" \
            "sacrebleu>=1.4.12" \
            sacremoses \
            bitarray

      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          REQ=$(find . -maxdepth 2 -name "requirements*.txt" | head -1)
          if [ -z "$REQ" ]; then
            echo "::warning::requirements.txt tidak ditemukan, skip"
          else
            grep -v -E "torch|fairseq" "$REQ" > requirements_fixed.txt
            pip install -r requirements_fixed.txt
          fi
          cd ..

      - name: Download RVC Pretrained Base
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/pretrained_v2
          HF="https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main"
          for F in hubert_base.pt rmvpe.pt; do
            DEST="Retrieval-based-Voice-Conversion-WebUI/assets/$F"
            if [ ! -f "$DEST" ]; then
              echo "Download $F..."
              curl -fL -o "$DEST" "$HF/$F" || echo "warning: gagal unduh $F"
            fi
          done

      - name: Download Model
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_choice }}
        run: |
          set -e
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          HF_BASE="https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2"

          case "$MODEL_CHOICE" in
            f0G40k)
              URL="$HF_BASE/f0G40k.pth" ;;
            pretrained_female)
              URL="$HF_BASE/f0G40k.pth" ;;
            pretrained_male)
              URL="$HF_BASE/f0G40k.pth" ;;
            custom_female)
              URL="https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0/female_model.pth" ;;
            *)
              echo "::error::Model tidak dikenal: $MODEL_CHOICE"; exit 1 ;;
          esac

          DEST="Retrieval-based-Voice-Conversion-WebUI/assets/weights/${MODEL_CHOICE}.pth"
          echo "Download $MODEL_CHOICE dari $URL"
          curl -fL -o "$DEST" "$URL"

          SIZE=$(stat -c%s "$DEST")
          echo "Ukuran: $SIZE byte"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::File terlalu kecil ($SIZE byte)"
            head -c 300 "$DEST" || true
            exit 1
          fi

      - name: Run Voice Changer
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_choice }}
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}" "$MODEL_CHOICE"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara-${{ github.event.inputs.model_choice }}
          path: output.wav
