name: RVC Voice Changer (Auto Model)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "After:"
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v13
          restore-keys: |
            ${{ runner.os }}-pip-rvc-v13

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v13

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      - name: Install Torch CPU Only
        run: |
          pip install torch==2.14.1+cpu torchaudio==2.11.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Build Tools
        run: |
          pip install setuptools wheel cython

      - name: Install Python Dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt -c constraints.txt

      # PENTING: --no-build-isolation supaya pip pakai torch CPU yang sudah ada,
      # bukan download ulang torch+CUDA (~3 GB) ke build env terpisah.
      - name: Install Fairseq
        run: |
          pip install git+https://github.com/facebookresearch/fairseq.git \
            --no-deps --no-build-isolation -c constraints.txt

      # fairseq dengan --no-deps tidak memasang dependensi runtime-nya.
      # Tambahkan manual supaya tidak ModuleNotFoundError saat runtime.
      - name: Install Fairseq Runtime Deps
        run: |
          pip install hydra-core omegaconf sacremoses bitarray

      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          grep -v -E "torch|fairseq" requirements.txt > requirements_fixed.txt
          pip install -r requirements_fixed.txt
          cd ..

      - name: Download Model from Release
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          curl -L -o Retrieval-based-Voice-Conversion-WebUI/assets/weights/female_model.pth \
          https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0/female_model.pth

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
