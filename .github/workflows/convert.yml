
name: RVC Voice Changer (Cached)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true
      model_url:
        description: 'Link Google Drive Model (.pth) [Opsional]'
        required: false
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # CACHE 1: PIP DEPENDENCIES (Library Python)
      - name: Cache Pip Packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v2
          restore-keys: |
            ${{ runner.os }}-pip-rvc-v2

      # CACHE 2: RVC REPO & MODEL (Folder Raksasa)
      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        # Hanya install jika cache pip belum ada
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt

      # Install dependencies RVC di dalam foldernya (jika repo baru di-clone)
      - name: Install RVC Dependencies
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          cd Retrieval-based-Voice-Conversion-WebUI
          pip install -r requirements.txt
          cd ..

      - name: Run Voice Changer
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}" "${{ github.event.inputs.model_url }}"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara
          path: output.wav
