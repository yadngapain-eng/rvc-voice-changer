name: RVC Voice Changer (5 Japanese Girls)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Link Google Drive File Audio (MP3/WAV)'
        required: true
      model_choice:
        description: 'Pilih Model Suara'
        type: choice
        required: true
        default: 'V2-AISO-HOWATTO'
        options:
          - V2-AISO-HOWATTO
          - V2-AISO-KAKKOII
          - V2-AISO-SARASARA
          - V2-AISO-SITTORI
          - V2-AISO-SYAKITTO

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-v16

      - name: Cache RVC Repo
        uses: actions/cache@v4
        id: rvc-cache
        with:
          path: Retrieval-based-Voice-Conversion-WebUI
          key: ${{ runner.os }}-rvc-repo-v16

      - name: Clone RVC Repo
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git \
            Retrieval-based-Voice-Conversion-WebUI

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Downgrade Pip
        run: |
          python -m pip install --upgrade pip==23.3.2

      - name: Install Torch CPU Only
        run: |
          pip install torch==2.4.1+cpu torchaudio==2.4.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Build Tools
        run: |
          pip install setuptools wheel cython

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt

      - name: Install Fairseq
        run: |
          pip install git+https://github.com/facebookresearch/fairseq.git \
            --no-deps --no-build-isolation -c constraints.txt

      - name: Install Fairseq Runtime Deps
        run: |
          pip install \
            "hydra-core>=1.0.7,<1.1" \
            "omegaconf>=2.0,<2.1" \
            "sacrebleu>=1.4.12" \
            sacremoses \
            bitarray

      - name: Install RVC Core Dependencies
        run: |
          # Repo RVC tidak selalu menyediakan requirements.txt di root.
          # Instal dependensi inti secara manual yang dibutuhkan infer_cli.
          pip install             "numpy<2.0"             "scipy"             "librosa"             "soundfile"             "ffmpeg-python"             "tensorboard"             "torchcrepe"             "faiss-cpu"             "praat-parselmouth"             "pyworld"             "edge-tts"

      - name: Download RVC Pretrained Base
        run: |
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/pretrained_v2
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/rmvpe
          HF="https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main"
          # hubert_base.pt
          if [ ! -f "Retrieval-based-Voice-Conversion-WebUI/assets/hubert_base.pt" ]; then
            curl -fL -o "Retrieval-based-Voice-Conversion-WebUI/assets/hubert_base.pt" "$HF/hubert_base.pt" || true
          fi
          # rmvpe.pt
          if [ ! -f "Retrieval-based-Voice-Conversion-WebUI/assets/rmvpe/rmvpe.pt" ]; then
            curl -fL -o "Retrieval-based-Voice-Conversion-WebUI/assets/rmvpe/rmvpe.pt" "$HF/rmvpe.pt" || true
          fi

      - name: Download Selected Model & Index
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_choice }}
        run: |
          set -e
          mkdir -p Retrieval-based-Voice-Conversion-WebUI/assets/weights
          DEST_DIR="Retrieval-based-Voice-Conversion-WebUI/assets/weights"
          BASE_URL="https://github.com/yadngapain-eng/rvc-voice-changer/releases/download/v1.0"

          # Download model .pth (dengan fallback anti-404)
          URL="$BASE_URL/$MODEL_CHOICE.pth"
          echo "Mengunduh dari: $URL"
          if ! curl -fsIL "$URL" | head -1 | grep -q "200"; then
            echo "::warning::URL 404. Mencari nama file .pth yang tersedia di release..."
            RELEASE_API="https://api.github.com/repos/yadngapain-eng/rvc-voice-changer/releases/tags/v1.0"
            AVAILABLE=$(curl -sfL "$RELEASE_API" | grep -oP '"name":\s*"\K[^"]*\.pth' | head -1)
            if [ -n "$AVAILABLE" ]; then
              echo "Fallback ke model: $AVAILABLE"
              # Ubah MODEL_CHOICE agar sesuai dengan file yang diunduh
              MODEL_CHOICE="${AVAILABLE%.pth}"
              URL="$BASE_URL/$AVAILABLE"
            else
              echo "::error::Tidak ada file .pth yang ditemukan di release API"
              exit 1
            fi
          fi
          curl -fL -o "$DEST_DIR/$MODEL_CHOICE.pth" "$URL"
          echo "MODEL_CHOICE=$MODEL_CHOICE" >> $GITHUB_ENV

          # Download index file (sama untuk semua model)
          echo "Mengunduh index file..."
          curl -fL -o "$DEST_DIR/trained_IVF832_Flat_nprobe_1_v2.index" "$BASE_URL/trained_IVF832_Flat_nprobe_1_v2.index"

          # Verifikasi ukuran model (> 10MB)
          SIZE=$(stat -c%s "$DEST_DIR/$MODEL_CHOICE.pth")
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::Model terlalu kecil ($SIZE byte)"
            exit 1
          fi
          echo "✓ Model dan index berhasil diunduh."

      - name: Run Voice Changer
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_choice }}
        run: |
          python voice_changer.py "${{ github.event.inputs.audio_url }}" "$MODEL_CHOICE"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Suara-${{ github.event.inputs.model_choice }}
          path: output.wav
